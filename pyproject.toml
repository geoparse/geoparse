[build-system]
# Required so that `uv sync` installs the project itself (editable) into .venv,
# which makes `import geoparse` work from tutorials/ and tests/.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Import package directory. Use ["src/geoparse"] if the project moves to a
# src/ layout.
packages = ["geoparse"]

[project]
name = "geoparse"
version = "0.7.2"
description = "A collection of Python functions for performing geospatial analysis and creating visualizations."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Abbas Kiasari", email = "kiasari@gmail.com" }]
keywords = [
    "geospatial",
    "GIS",
    "cartography",
    "visualization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Visualization",
]
requires-python = ">=3.11.5,<4.0"

# Runtime dependencies only: what `import geoparse` requires.
# Jupyter is intentionally excluded (see the `dev` group), so a plain
# `pip install geoparse` stays lightweight.
# To audit for unused or undeclared dependencies: `uvx deptry .`
dependencies = [
    "pyarrow>=22.0.0",
    "scipy>=1.16.0",
    "geopandas>=1.1.0",
    "matplotlib>=3.10,<4",
    "lonboard>=0.16.0",
    "fsspec>=2025.12.0",
    "folium>=0.20.0",
    "pygeohash>=1.2.0",
    "s2>=0.1.9",
    "h3>=4.3.0",
    "rasterio>=1.4.4",
    "polars>=1.38.1",
    "duckdb>=1.4.4",
    "requests>=2.33.0",
]

[project.urls]
Homepage = "https://github.com/geoparse/geoparse"
Repository = "https://github.com/geoparse/geoparse"
Issues = "https://github.com/geoparse/geoparse/issues"

[dependency-groups]
# Development tooling, tests, documentation and the Jupyter stack used to run
# the tutorials. Not part of the published package; pip users can install it
# with `pip install --group dev` (pip 25.1+).
dev = [
    "jupyterlab>=4.6.4",
    "nbconvert>=7.17.2",
    "ruff>=0.6.9",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "coverage[toml]>=7.6.1",
    "pre-commit>=4.0.0",
    "sphinx>=7.4.7",
    "sphinx-rtd-theme>=3.0.1",
]

# Minimum versions of transitive dependencies, set to exclude releases with
# known security issues. These apply to contributors only; uv.lock records the
# resolved versions.
security = [
    "jupyter-server>=2.18.0",
    "tornado>=6.6",
    "anyio>=4.14.2",
    "urllib3>=2.8.0",
    "certifi>=2026.10.18",
    "virtualenv>=21.14.9",
    "filelock>=4.2.1",
    "soupsieve>=4.0.0",
    "mistune>=3.3.4",
]

[tool.uv]
# Reproducibility: ignore package releases newer than this date when locking.
exclude-newer = "2026-11-10T00:00:00Z"
# A plain `uv sync` installs these groups (including Jupyter, via `dev`).
# Use `uv sync --no-dev` for a runtime-only environment.
default-groups = ["dev", "security"]

# -----------------------------------------------------------------------------
# Tooling
# -----------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort (import order)
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=geoparse --cov-report=term-missing"

[tool.coverage.run]
source = ["geoparse"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
