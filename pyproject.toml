[build-system]
# Without this table, `uv sync` does not install the project into .venv, which
# is why `import geoparse` fails from tutorials/. With it, uv installs the
# package in editable mode, so notebooks always use your working tree.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Current flat layout. If you move to a src/ layout, change this to
# ["src/geoparse"].
packages = ["geoparse"]

[project]
name = "geoparse"
version = "0.7.2"
description = "A collection of Python functions for performing geospatial analysis and creating visualizations."
authors = [{name = "Abbas Kiasari", email = "kiasari@gmail.com"}]
license = {file = "LICENSE"}
readme = "README.md"
keywords = [
    "Geospatial",
    "GIS",
    "Cartography",
    "Visualization",
]

requires-python = ">=3.11,<4.0"

# Runtime dependencies only: what `import geoparse` needs.
# Before removing any of these, check they are not imported inside the package:
#   uvx deptry .
dependencies = [
    "pyarrow>=22.0.0",
    "scipy>=1.16.0",
    "geopandas>=1.1.0",
    "matplotlib>=3.10,<4",   # was ==3.10.0; an exact pin conflicts with other packages
    "lonboard>=0.16.0",
    "fsspec>=2025.12.0",
    "folium>=0.20.0",
    "pygeohash>=1.2.0",
    "s2>=0.1.9",
    "h3>=4.3.0",
    "rasterio>=1.4.4",
    "polars>=1.38.1",
    "duckdb>=1.4.4",
    "requests>=2.33.0",
]

[dependency-groups]
# Tools for working on the library (not installed for pip users).
dev = [
    "jupyterlab>=4.6.4",
    "nbconvert>=7.17.2",
    "ruff>=0.6.9",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "coverage[toml]>=7.6.1",
    "pre-commit>=4.0.0",
    "sphinx>=7.4.7",
    "sphinx-rtd-theme>=3.0.1",
]

# Version floors for transitive packages, to avoid known security issues.
# They only affect contributors; uv.lock records the resolved versions.
security = [
    "jupyter-server>=2.18.0",
    "tornado>=6.6",          # fix security issues
    "anyio>=4.14.2",
    "urllib3>=2.8.0",
    "certifi>=2026.10.18",
    "virtualenv>=21.14.9",
    "filelock>=4.2.1",
    "soupsieve>=2.9.0",
]

[tool.uv]
exclude-newer = "2026-11-10T00:00:00Z"
# A plain `uv sync` installs these groups. Add the notebooks extra with:
#   uv sync --extra notebooks
default-groups = ["dev", "security"]
